name: Free Agent CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Build executable
      run: go build -o free-agent ./cmd/free-agent

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build for multiple platforms
      run: |
        GOOS=linux GOARCH=amd64 go build -o free-agent-linux-amd64 ./cmd/free-agent
        GOOS=windows GOARCH=amd64 go build -o free-agent-windows-amd64.exe ./cmd/free-agent
        GOOS=darwin GOARCH=amd64 go build -o free-agent-darwin-amd64 ./cmd/free-agent

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: free-agent-binaries
        path: |
          free-agent-linux-amd64
          free-agent-windows-amd64.exe
          free-agent-darwin-amd64